<!DOCTYPE html>
<html lang="it">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokaCards</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layouts.css">
</head>

<body>

  <h1>TokaCards</h1>

  <div class="game-area">

    <div id="card" class="mode-forbidden">
      <img id="cardImage" src="images/forbidden.png" alt="Carta">

      <!-- LAYERS -->
      <div class="layer word" id="word"></div>
      <div class="layer description" id="description"></div>
      <ul class="layer forbidden-list" id="forbiddenList"></ul>
    </div>

    <button id="drawButton">Draw a New Card</button>

  </div>

  <script src="script.js"></script>
</body>

</html>
