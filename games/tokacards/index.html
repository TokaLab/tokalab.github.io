<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokaCards</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layouts.css">
</head>

<footer class="app-footer">
  <span class="alpha-badge">
    Alpha version —
    <a href="https://tokalab.github.io/" target="_blank" rel="noopener">
      Contact Us
    </a>
  </span>
</footer>

<body>

  <h1>TokaCards</h1>
  <div class="game-area">

    <!-- Mode Selector -->
    <div id="modeSelector" class="mode-selector">
      <img id="cardImageSelect" src="images/modes.png" alt="Carta">
      <div class="mode-option">
        <input type="checkbox" id="modeMimic" value="mimic">
        <label for="modeMimic">Mimic</label>
      </div>
      <div class="mode-option">
        <input type="checkbox" id="modeForbidden" value="forbidden">
        <label for="modeForbidden">Forbidden</label>
      </div>
      <div class="mode-option">
        <input type="checkbox" id="modeDrawIt" value="drawit">
        <label for="modeDrawIt">DrawIt</label>
      </div>
    </div>

    <!-- Bottone Start -->
    <button id="startButton" class="game-button">Start Game</button>
    
    <!-- Carta -->
    <div id="card" class="mode-forbidden" style="display:none;">
      <img id="cardImage" src="images/forbidden.png" alt="Carta">
      <div class="layer word" id="word"></div>
      <div class="layer description" id="description"></div>
      <ul class="layer forbidden-list" id="forbiddenList"></ul>
    </div>

    <!-- Bottone Draw -->
    <button id="drawButton" style="display:none;">Draw a New Card</button>

  </div>

  <script src="script.js"></script>
</body>

</html>
